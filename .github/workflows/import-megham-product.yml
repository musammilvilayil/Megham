name: Import MEGHAM product

on:
  push:
    branches:
      - agent/import-megham-cloud-product

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-megham-cloud-product
          fetch-depth: 0

      - name: Check import marker
        id: guard
        shell: bash
        run: |
          if [ -f .import/ready ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild, verify, and extract archive
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .import/*.part > /tmp/megham.zip.b64
          base64 --decode /tmp/megham.zip.b64 > /tmp/megham.zip
          echo "68c62eb2776a4bad83eda32881ced6d3734cfeb1559f50793ada5411bf2c4404  /tmp/megham.zip" | sha256sum -c -
          unzip -o /tmp/megham.zip -d .
          rm -rf .import

      - name: Commit imported product
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import MEGHAM Cloud product"
          git push origin HEAD:agent/import-megham-cloud-product
